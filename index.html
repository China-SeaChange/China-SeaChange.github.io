<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>架构图库</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 张旭泉开发 -->
    <div class="login-container" id="loginContainer">
        <div class="animated-bg"></div>
        <div class="login-form">
            <h2 class="login-title">架构图库V1.0</h2>
            <div class="input-group">
                <label for="password">请输入灵感通行证</label>
                <input type="password" id="password" placeholder="输入密码..." autocomplete="off">
            </div>
            <button class="login-btn" id="loginBtn">
                <span class="btn-text">进入系统</span>
                <div class="btn-loader"></div>
            </button>
            <div class="error-message" id="errorMessage"></div>
        </div>
        <div class="login-footer">
            &copy; 2023 架构图库 - 仅供授权内部牛马使用
        </div>
    </div>
    
   
    <div class="app-container" id="appContainer">
        <header>
            <h1>架构图库V1.0</h1>
            <p class="subtitle">要加入自己的思考！</p>
        </header>
        
        <div class="container">
            
            <div class="search-container">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索模板名称或描述...">
                    <div class="search-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </div>
                </div>
                <div class="search-results" id="searchResults"></div>
            </div>
            
            <div class="template-list" id="templateList">
               
            </div>
            
            <div class="preview-section" id="previewSection">
                <div class="preview-title">
                    <span id="previewTitle">模板预览</span>
                    <button class="copy-btn" id="copyPreviewBtn">复制图形代码</button>
                </div>
                <div class="preview-container" id="previewContainer">
                    
                </div>
            </div>
            
            <div class="code-section" id="codeSection">
                <div class="code-header">
                    <h3>SVG源代码</h3>
                    <button class="copy-code-btn" id="copyCodeBtn">复制代码</button>
                </div>
                <div class="code-container" id="codeContainer">
                   
                </div>
            </div>
        </div>
        
        <div class="notification" id="notification">代码已复制到剪贴板！</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
